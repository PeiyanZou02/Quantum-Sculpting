<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:10px;width:{{ w }}px">
  <sc-if value="{{ hasTitle }}"><span style="font:600 10px/1 'Geist Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--qs-ink)">{{ title }}</span></sc-if>
  <sc-if value="{{ grid }}" hint-placeholder-val="{{ true }}"><div style="display:grid;grid-template-columns:{{ kw }}px minmax(0,1fr) auto;column-gap:14px;row-gap:4px;font:400 10px/1.3 'Geist Mono',monospace;font-variant-numeric:tabular-nums;color:var(--qs-ink)"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="3"><span>{{ r.k }}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.v }}</span><span style="color:var(--qs-ink3)">{{ r.e }}</span></sc-for></div></sc-if>
  <sc-if value="{{ leader }}"><div style="display:flex;flex-direction:column;gap:8px;font:400 10px/1 'Geist Mono',monospace;font-variant-numeric:tabular-nums;color:var(--qs-ink)"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="3"><div style="display:flex;align-items:baseline;gap:8px"><span>{{ r.k }}</span><span style="flex:1;height:0;border-bottom:1px dotted var(--qs-ink4)"></span><span>{{ r.v }}</span><span style="width:10px;color:var(--qs-ink3)">{{ r.e }}</span></div></sc-for></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:120},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Scene&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rows&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Samples|32/64;Seed|457453234&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;leader&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;kw&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:88,&quot;tsType&quot;:&quot;number&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:260,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, lead = !!p.leader;
    const rows = String(p.rows ?? 'Samples|32/64;Seed|457453234').split(';').map(x => { const [k, v, e] = x.split('|'); return { k: k ?? '', v: v ?? '', e: e ?? '' }; });
    return { title: p.title ?? '', hasTitle: !!p.title, rows, grid: !lead, leader: lead, kw: +(p.kw ?? 88), w: +(p.w ?? 260) };
  }
}
</script>
</body>
</html>
