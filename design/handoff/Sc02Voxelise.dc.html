<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>@font-face{font-family:'TWK Everett';src:url(fonts/TWKEverett-Book.ttf) format('truetype');font-weight:300 500;font-style:normal;font-display:swap}body{margin:0;background:#D6D7DA}a{color:#151618}a:hover{color:#55575D}</style><script src="qvoxel.js"></script></helmet>
<div data-screen-label="02 Voxelise" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#E3E4E7;color:#151618;--qs-bg:#E3E4E7;--qs-ink:#151618;--qs-ink2:#55575D;--qs-ink3:#8B8D93;--qs-ink4:#B3B5BB;--qs-line:rgba(21,22,24,.16)">
  <div data-vox="grid" data-theme="light" data-slice="16" data-fit="1.3" data-elev="22" style="position:absolute;left:432px;top:112px;width:1056px;height:720px"></div>
  <dc-import name="SculptorChrome" step="1" run="test cup|32³|coverage|enclosed|pad 2" atlas="on" view="1" avail="2" style="position:absolute;left:0;top:0" hint-size="1920px,1080px"></dc-import>
  <div style="position:absolute;left:48px;top:260px;width:344px;display:flex;flex-direction:column;gap:26px">
    <div style="display:flex;flex-direction:column;gap:10px"><span style="font:400 11px/1 'Geist Mono',monospace;color:#8B8D93">Step 02</span><span style="font:400 28px/1.1 'TWK Everett',sans-serif">Voxelise</span><span style="font:400 14px/1.35 'TWK Everett',sans-serif;color:#55575D;text-wrap:pretty">Turn the mesh into a grid of values. With coverage, the 0.5 level sits on the true surface.</span></div>
    <div style="display:flex;flex-direction:column;gap:10px"><span style="font:400 11px/1 'Geist Mono',monospace;color:#8B8D93">Grid size</span><div style="display:inline-flex;align-self:flex-start;padding:2px;border-radius:999px;border:1px solid rgba(21,22,24,.26);font:400 11px/1 'Geist Mono',monospace"><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid transparent;color:#55575D">16³</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid #151618;background:#CBCCD0">32³</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid transparent;color:#55575D">64³</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid transparent;color:#55575D">128³</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid transparent;color:#55575D">256³</span></div><span style="font:400 11px/1.4 'Geist Mono',monospace;color:#8B8D93">One Atlas job · 15 qubits</span></div>
    <div style="display:flex;flex-direction:column;gap:10px"><span style="font:400 11px/1 'Geist Mono',monospace;color:#8B8D93">Fill</span><div style="display:inline-flex;align-self:flex-start;padding:2px;border-radius:999px;border:1px solid rgba(21,22,24,.26);font:400 11px/1 'Geist Mono',monospace"><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid #151618;background:#CBCCD0">Enclosed</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid transparent;color:#55575D">Cap, then fill</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid transparent;color:#55575D">Shell</span></div></div>
    <div style="display:flex;flex-direction:column;gap:10px"><span style="font:400 11px/1 'Geist Mono',monospace;color:#8B8D93">Values</span><div style="display:inline-flex;align-self:flex-start;padding:2px;border-radius:999px;border:1px solid rgba(21,22,24,.26);font:400 11px/1 'Geist Mono',monospace"><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid #151618;background:#CBCCD0">Coverage</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid transparent;color:#55575D">0 or 1</span></div></div>
    <div style="display:flex;align-items:center;justify-content:space-between"><span style="font:400 11px/1 'Geist Mono',monospace;color:#8B8D93">Padding · cells</span><div style="display:inline-flex;align-items:center;height:30px;border-radius:999px;border:1px solid rgba(21,22,24,.26);box-sizing:border-box;font:400 13px/1 'Geist Mono',monospace"><span style="padding:0 12px;color:#55575D">−</span><span style="width:24px;text-align:center">2</span><span style="padding:0 12px;color:#55575D">+</span></div></div>
    <dc-import name="QReadout" title="Grid" kw="96" w="344" rows="Solid|2,914 cells|8.9%;Voxel|3.2 mm;Shape|32 × 32 × 32" hint-size="344px,70px"></dc-import>
  </div>
  <div style="position:absolute;left:48px;top:1000px"><dc-import name="QPill" kind="commit" label="Quantum" hint-size="120px,30px"></dc-import></div>
  <div style="position:absolute;left:1528px;top:112px"><dc-import name="QSlice" layout="inspector" axis="z" index="16" hint-size="344px,800px"></dc-import></div>
  <div style="position:absolute;left:432px;top:868px;width:1056px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between"><span style="font:600 10px/1 'Geist Mono',monospace;letter-spacing:.04em">LAYERS</span><span style="font:400 11px/1 'Geist Mono',monospace;color:#8B8D93">solid cells per layer · base 2–3, walls 4–29</span></div>
    <div style="display:flex;align-items:flex-end;gap:4px;height:110px;border-bottom:1px solid #B3B5BB"><sc-for list="{{ layers }}" as="l" hint-placeholder-count="32"><span style="flex:1;height:{{ l.h }}px;background:{{ l.c }}"></span></sc-for></div>
    <div style="display:flex;justify-content:space-between;font:400 10px/1 'Geist Mono',monospace;color:#8B8D93"><span>z 0</span><span style="color:#151618">16</span><span>31</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  renderVals() {
    const cnt = Array.from({ length: 32 }, (_, z) => z < 2 || z > 29 ? 0 : z < 4 ? 380 : 84 + (z >= 10 && z <= 22 ? 10 : 0));
    return { layers: cnt.map((c, z) => ({ h: Math.max(1, Math.round(c / 380 * 108)), c: z === 16 ? '#151618' : c ? '#8B8D93' : '#B3B5BB' })) };
  }
}
</script>
</body>
</html>
