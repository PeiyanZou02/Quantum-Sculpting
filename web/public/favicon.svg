<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .g { fill: #E3E4E7 } .i { fill: #151618 } .r { fill: none; stroke: #151618 }
    @media (prefers-color-scheme: dark) { .g { fill: #141517 } .i { fill: #E8E9EC } .r { stroke: #E8E9EC } }
  </style>
  <rect class="g" width="32" height="32"/>
  <rect class="r" x="2.5" y="2.5" width="27" height="27" stroke-width="1"/>
  <!-- one voxel blurred by Quantum Blur Core: full at the centre, falling off by distance -->
  <rect class="i" x="6"  y="6"  width="6" height="6" opacity=".22"/>
  <rect class="i" x="13" y="6"  width="6" height="6" opacity=".5"/>
  <rect class="i" x="20" y="6"  width="6" height="6" opacity=".22"/>
  <rect class="i" x="6"  y="13" width="6" height="6" opacity=".5"/>
  <rect class="i" x="13" y="13" width="6" height="6"/>
  <rect class="i" x="20" y="13" width="6" height="6" opacity=".5"/>
  <rect class="i" x="6"  y="20" width="6" height="6" opacity=".22"/>
  <rect class="i" x="13" y="20" width="6" height="6" opacity=".5"/>
  <rect class="i" x="20" y="20" width="6" height="6" opacity=".22"/>
</svg>
